- name: Copy kubeconfigs from control planes to bastion
  hosts: controlplanes
  gather_facts: no
  become: true  # required for reading /etc/kubernetes/admin.conf remotely

  vars:
    kubeconfig_dir: "{{ lookup('env', 'HOME') }}/ansible/kubeconfigs"
    remote_admin_conf: /etc/kubernetes/admin.conf

  tasks:
    - name: Ensure kubeconfig directory exists on bastion
      ansible.builtin.file:
        path: "{{ kubeconfig_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false  # ✅ create as ubuntu user

    - name: Wait until admin.conf exists on control plane
      ansible.builtin.wait_for:
        path: "{{ remote_admin_conf }}"
        state: present
        timeout: 600

    - name: Read kubeconfig from control plane (needs root)
      ansible.builtin.slurp:
        src: "{{ remote_admin_conf }}"
      register: kubeconfig_data
      become: true   # ✅ needed because /etc/kubernetes/admin.conf is root:root

    - name: Fix ownership of kubeconfig directory on bastion
      ansible.builtin.file:
        path: "{{ kubeconfig_dir }}"
        owner: ubuntu
        group: ubuntu
        mode: "0755"
        state: directory
      delegate_to: localhost
      become: true  # ✅ need sudo to change ownership to ubuntu

    - name: Write kubeconfig to bastion (no sudo!)
      ansible.builtin.copy:
        content: "{{ kubeconfig_data.content | b64decode }}"
        dest: "{{ kubeconfig_dir }}/{{ hostvars[inventory_hostname].cluster_name }}-kubeconfig.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false   # ✅ write as ubuntu

    - name: List kubeconfigs after copy
      ansible.builtin.command:
        cmd: ls -l {{ kubeconfig_dir }}
      delegate_to: localhost
      changed_when: false
      become: false
