---
- name: Merge existing kubeconfigs into ~/.kube/config
  hosts: localhost
  connection: local             
  gather_facts: no

  vars:
    kubeconfig_dir: "{{ lookup('env','HOME') }}/ansible/kubeconfigs"
    merged_kubeconfig: "{{ lookup('env','HOME') }}/.kube/config"

  tasks:
    - name: Ensure ~/.kube directory exists
      ansible.builtin.file:
        path: "{{ lookup('env','HOME') }}/.kube"
        state: directory
        mode: "0700"

    - name: Rename contexts in each kubeconfig to include cluster name        
      ansible.builtin.shell: |
        cluster_name=$(basename {{ item }} | sed 's/-kubeconfig.yaml//')      
        kubectl config --kubeconfig={{ item }} rename-context kubernetes-admin@kubernetes ${cluster_name}-context || true
      args:
        executable: /bin/bash
      loop: "{{ lookup('ansible.builtin.fileglob', kubeconfig_dir + '/*-kubeconfig.yaml', wantlist=True) }}"
      register: rename_result

    - name: Debug found kubeconfigs
      ansible.builtin.command:
        cmd: ls -1 {{ kubeconfig_dir }}
      register: found_kubeconfigs
      changed_when: false

    - ansible.builtin.debug:
        var: found_kubeconfigs.stdout_lines

    - name: Merge all kubeconfigs into ~/.kube/config (debug mode)
      ansible.builtin.shell: |
        echo "---- Debug: listing kubeconfig files ----"
        ls -l {{ kubeconfig_dir }}/*-kubeconfig.yaml || true
        echo "---- Debug: Building KUBECONFIG ----"
        export KUBECONFIG=$(ls -1 {{ kubeconfig_dir }}/*-kubeconfig.yaml | paste -sd ":" -)

        echo "KUBECONFIG=$KUBECONFIG"
        echo "---- Debug: Running kubectl config view ----"
        kubectl config view --flatten > {{ merged_kubeconfig }} 2> /tmp/kubectl_merge_error.log
        rc=$?
        echo "Exit code: $rc"
        echo "---- Debug: kubectl stderr ----"
        cat /tmp/kubectl_merge_error.log || true
        echo "---- Debug: merged kubeconfig preview ----"
        head -n 15 {{ merged_kubeconfig }} || true
        exit $rc
      args:
        executable: /bin/bash
      register: merge_result
      ignore_errors: yes

    - name: Print stdout from merge command
      ansible.builtin.debug:
        var: merge_result.stdout_lines

    - name: Print stderr from merge command
      ansible.builtin.debug:
        var: merge_result.stderr_lines

    - name: Show merged kubeconfig contexts
      ansible.builtin.command:
        cmd: kubectl config get-contexts
      register: contexts_output
      changed_when: false

    - name: Display available contexts
      ansible.builtin.debug:
        msg: "{{ contexts_output.stdout_lines }}"