---
- name: Merge kubeconfigs into ~/.kube/config and verify
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    kubeconfig_dir: "{{ lookup('env','HOME') }}/ansible/kubeconfigs"
    merged_kubeconfig: "{{ lookup('env','HOME') }}/.kube/config"

  tasks:
    - name: Ensure ~/.kube directory exists
      ansible.builtin.file:
        path: "{{ lookup('env','HOME') }}/.kube"
        state: directory
        mode: "0700"

    - name: Merge kubeconfigs
      ansible.builtin.shell: |
        export KUBECONFIG=$(ls -1 {{ kubeconfig_dir }}/*-kubeconfig.yaml | paste -sd ":" -)
        echo "Merging: $KUBECONFIG"
        kubectl config view --flatten > {{ merged_kubeconfig }}
      args:
        executable: /bin/bash

    - name: Verify contexts and clusters
      ansible.builtin.shell: |
        echo "---- Contexts ----"
        kubectl config get-contexts
        echo "---- Clusters ----"
        kubectl config get-clusters
      args:
        executable: /bin/bash
      register: verify
      changed_when: false

    - name: Show verification
      ansible.builtin.debug:
        var: verify.stdout_lines
