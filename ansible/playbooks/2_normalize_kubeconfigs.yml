---
- name: Normalize cluster/context names inside kubeconfigs
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    kubeconfig_dir: "{{ lookup('env','HOME') }}/ansible/kubeconfigs"

  tasks:

    - name: Install yq (Go version) if missing
      ansible.builtin.shell: |
        if ! command -v yq >/dev/null 2>&1; then
          echo "Installing yq (Go version)..."
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
        fi
        yq --version
      args:
        executable: /bin/bash

    - name: Normalize cluster, context, and current-context
      ansible.builtin.shell: |
        file="{{ item }}"
        cluster_name=$(basename "$file" | sed 's/-kubeconfig.yaml//')
        echo ">>> Normalizing $file for cluster: $cluster_name"

        export cluster_name

        # rename context and its cluster reference
        yq -i '.contexts |= map(.name = env(cluster_name) | .context.cluster = env(cluster_name))' "$file"

        # rename cluster section
        yq -i '.clusters |= map(.name = env(cluster_name))' "$file"

        # set current-context
        yq -i '.["current-context"] = env(cluster_name)' "$file"

        echo "✅ Done: $file"
      args:
        executable: /bin/bash
      loop: "{{ lookup('ansible.builtin.fileglob', kubeconfig_dir + '/*-kubeconfig.yaml', wantlist=True) }}"
      register: normalize_output

    - name: Rename user inside kubeconfig to make it unique per cluster
      ansible.builtin.shell: |
        file="{{ item }}"
        cluster_name=$(basename "$file" | sed 's/-kubeconfig.yaml//')
        echo ">>> Renaming user inside $file to kubernetes-admin-${cluster_name}"

        export cluster_name

        # rename the user section name
        yq -i '.users |= map(.name = "kubernetes-admin-" + env(cluster_name))' "$file"

        # update context reference to match the renamed user
        yq -i '.contexts |= map(.context.user = "kubernetes-admin-" + env(cluster_name))' "$file"

        echo "✅ User renamed for $file"
      args:
        executable: /bin/bash
      loop: "{{ lookup('ansible.builtin.fileglob', kubeconfig_dir + '/*-kubeconfig.yaml', wantlist=True) }}"
      register: user_fix_output

    - name: Show normalization logs
      ansible.builtin.debug:
        var: normalize_output.stdout_lines

    - name: Show user rename logs
      ansible.builtin.debug:
        var: user_fix_output.stdout_lines